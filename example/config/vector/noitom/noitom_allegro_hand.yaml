# Allegro Hand - KeyVectorOptimizer (Noitom PNS-G input)
# 4 fingers: thumb, index, middle, ring (no pinky)

optimizer:
  type: "KeyVectorOptimizer"

robot:
  type: "allegro_hand"
  urdf_path: "assets/allegro_hand/allegro_hand_right.urdf"

retarget:
  huber_delta: 2.0
  norm_delta: 0.04
  lp_alpha: 0.4

  scaling_factor: 1.028
  key_vectors:
  - {origin: base_link, task: link_15.0_tip, origin_kp: 0, task_kp: 4}
  - {origin: base_link, task: link_3.0_tip, origin_kp: 0, task_kp: 8}
  - {origin: base_link, task: link_7.0_tip, origin_kp: 0, task_kp: 12}
  - {origin: base_link, task: link_11.0_tip, origin_kp: 0, task_kp: 16}

  mediapipe_rotation:
    x: 0.0
    y: 0.0
    z: 0.0

render:
  camera:
    azimuth: 180
    elevation: -20
    distance: 0.5
