# SVH Hand - KeyVectorOptimizer (VisionPro AVP input)

optimizer:
  type: "KeyVectorOptimizer"

robot:
  type: "svh_hand"
  urdf_path: "assets/schunk_hand/schunk_svh_hand_right.urdf"

retarget:
  huber_delta: 2.0
  norm_delta: 0.04
  lp_alpha: 0.4

  scaling_factor: 1.152
  key_vectors:
  - {origin: right_hand_base_link, task: thtip, origin_kp: 0, task_kp: 4}
  - {origin: right_hand_base_link, task: fftip, origin_kp: 0, task_kp: 8}
  - {origin: right_hand_base_link, task: mftip, origin_kp: 0, task_kp: 12}
  - {origin: right_hand_base_link, task: rftip, origin_kp: 0, task_kp: 16}
  - {origin: right_hand_base_link, task: lftip, origin_kp: 0, task_kp: 20}

  mediapipe_rotation:
    x: -5.0
    y: -5.0
    z: 0.0

render:
  camera:
    azimuth: 135
    elevation: -20
    distance: 0.5
