# Ability Hand - KeyVectorOptimizer (VisionPro AVP input)

optimizer:
  type: "KeyVectorOptimizer"

robot:
  type: "ability_hand"
  urdf_path: "assets/ability_hand/ability_hand_right.urdf"

retarget:
  huber_delta: 2.0
  norm_delta: 0.04
  lp_alpha: 0.4

  scaling_factor: 0.879
  key_vectors:
  - {origin: base, task: thumb_tip, origin_kp: 0, task_kp: 4}
  - {origin: base, task: index_tip, origin_kp: 0, task_kp: 8}
  - {origin: base, task: middle_tip, origin_kp: 0, task_kp: 12}
  - {origin: base, task: ring_tip, origin_kp: 0, task_kp: 16}
  - {origin: base, task: pinky_tip, origin_kp: 0, task_kp: 20}
  - {origin: base, task: thumb_L1, origin_kp: 0, task_kp: 2}
  - {origin: base, task: index_L1, origin_kp: 0, task_kp: 6}
  - {origin: base, task: middle_L1, origin_kp: 0, task_kp: 10}
  - {origin: base, task: ring_L1, origin_kp: 0, task_kp: 14}
  - {origin: base, task: pinky_L1, origin_kp: 0, task_kp: 18}

  mediapipe_rotation:
    x: -5.0
    y: -5.0
    z: 0.0

render:
  camera:
    azimuth: 135
    elevation: -20
    distance: 0.5
