# Leap Hand - KeyVectorOptimizer (Quest 3 HTS input)
# 4 fingers: thumb, index, middle, ring (no pinky)

optimizer:
  type: "KeyVectorOptimizer"

robot:
  type: "leap_hand"
  urdf_path: "assets/leap_hand/leap_hand_right.urdf"

retarget:
  huber_delta: 2.0
  norm_delta: 0.04
  lp_alpha: 0.4

  scaling_factor: 1.209
  key_vectors:
  - {origin: base, task: thumb_tip_head, origin_kp: 0, task_kp: 4}
  - {origin: base, task: index_tip_head, origin_kp: 0, task_kp: 8}
  - {origin: base, task: middle_tip_head, origin_kp: 0, task_kp: 12}
  - {origin: base, task: ring_tip_head, origin_kp: 0, task_kp: 16}
  - {origin: base, task: thumb_dip, origin_kp: 0, task_kp: 2}
  - {origin: base, task: dip, origin_kp: 0, task_kp: 6}
  - {origin: base, task: dip_2, origin_kp: 0, task_kp: 10}
  - {origin: base, task: dip_3, origin_kp: 0, task_kp: 14}

  mediapipe_rotation:
    x: 0.0
    y: 0.0
    z: 0.0

render:
  camera:
    azimuth: 180
    elevation: -20
    distance: 0.5
