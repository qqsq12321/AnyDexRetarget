# Linker L20 - KeyVectorOptimizer (Pico 4 input)

optimizer:
  type: "KeyVectorOptimizer"

robot:
  type: "linker_l20"

retarget:
  huber_delta: 2.0
  norm_delta: 0.04
  lp_alpha: 0.4
  scaling_factor: 1.54

  # Pinch contact: pulls the thumb tip and the closest finger tip together
  # once they are within d2 (cm) of each other, so a pinch actually closes
  # instead of leaving a gap between the fingertip surfaces. tip_offset
  # moves the contact point from the GEORT distal link origin (at the
  # DIP/IP joint) to the true fingertip surface -- same values as
  # ROBOT_CONFIGS['linker_l20']['tip_offsets'] in robot_configs.py.
  w_contact: 0.0  # disabled
  # contact:
  #   thumb_tip_link: thumb_distal
  #   thumb_tip_kp: 4
  #   thumb_tip_offset: [-0.0110, 0.0, 0.0277]
  #   fingers:
  #     - {tip_link: index_distal, tip_kp: 8, tip_offset: [-0.0135, 0.0, 0.0188], d1: 2.0, d2: 4.0}
  #     - {tip_link: middle_distal, tip_kp: 12, tip_offset: [-0.0135, 0.0, 0.0188], d1: 2.0, d2: 4.0}
  #     - {tip_link: ring_distal, tip_kp: 16, tip_offset: [-0.0135, 0.0, 0.0188], d1: 2.0, d2: 4.0}
  #     - {tip_link: pinky_distal, tip_kp: 20, tip_offset: [-0.0135, 0.0, 0.0188], d1: 2.0, d2: 4.0}

  key_vectors:
    # thumb
  - {origin: hand_base_link, task: thumb_proximal, origin_kp: 0, task_kp: 2}
  - {origin: hand_base_link, task: thumb_distal, origin_kp: 0, task_kp: 4}
    # index
  - {origin: hand_base_link, task: index_middle, origin_kp: 0, task_kp: 6}
  - {origin: hand_base_link, task: index_distal, origin_kp: 0, task_kp: 8}
    # middle
  - {origin: hand_base_link, task: middle_middle, origin_kp: 0, task_kp: 10}
  - {origin: hand_base_link, task: middle_distal, origin_kp: 0, task_kp: 12}
    # ring
  - {origin: hand_base_link, task: ring_middle, origin_kp: 0, task_kp: 14}
  - {origin: hand_base_link, task: ring_distal, origin_kp: 0, task_kp: 16}
    # pinky
  - {origin: hand_base_link, task: pinky_middle, origin_kp: 0, task_kp: 18}
  - {origin: hand_base_link, task: pinky_distal, origin_kp: 0, task_kp: 20}

  # apply_mediapipe_transformations() yields mirrored Y axes for the
  # two hands.  Mirror the fixed palm-frame correction as well so the input
  # palm normal/width axes remain aligned with the L20 base frame.
  mediapipe_rotation:
    right: {x: -10.0, y: -6.0, z: -10.0}
    left: {x: 10.0, y: 0.0, z: 10.0}

render:
  camera:
    azimuth: 180
    elevation: 0.0
    distance: 0.7
