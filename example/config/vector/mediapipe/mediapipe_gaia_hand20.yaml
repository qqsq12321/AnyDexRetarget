# Gaia Hand20 - KeyVectorOptimizer (MediaPipe video/camera input)
# Initial Gaia Hand20 simulation profile; scale values inherit the Wuji 20-DOF baseline.
# Scale values from wuji-retargeting-private/config/vector/vector_video.yaml
# norm_delta=0.06: higher than AVP because monocular depth is noisier

optimizer:
  type: "KeyVectorOptimizer"

robot:
  type: "gaia_hand20"

retarget:
  huber_delta: 2.0
  norm_delta: 0.06
  lp_alpha: 0.4

  scaling_factor: 1.028
  key_vectors:
    # thumb (thumb): scale 0.95 — thumb tends to be over-estimated by MediaPipe
  - {origin: right_base_link, task: right_thumb_link_3, origin_kp: 0, task_kp: 2}
  - {origin: right_base_link, task: right_thumb_link_4, origin_kp: 0, task_kp: 3}
  - {origin: right_base_link, task: right_thumb_tip, origin_kp: 0, task_kp: 4}
    # index (index)
  - {origin: right_base_link, task: right_index_link_3, origin_kp: 0, task_kp: 6}
  - {origin: right_base_link, task: right_index_link_4, origin_kp: 0, task_kp: 7}
  - {origin: right_base_link, task: right_index_tip, origin_kp: 0, task_kp: 8}
    # middle (middle)
  - {origin: right_base_link, task: right_middle_link_3, origin_kp: 0, task_kp: 10}
  - {origin: right_base_link, task: right_middle_link_4, origin_kp: 0, task_kp: 11}
  - {origin: right_base_link, task: right_middle_tip, origin_kp: 0, task_kp: 12}
    # ring (ring)
  - {origin: right_base_link, task: right_ring_link_3, origin_kp: 0, task_kp: 14}
  - {origin: right_base_link, task: right_ring_link_4, origin_kp: 0, task_kp: 15}
  - {origin: right_base_link, task: right_ring_tip, origin_kp: 0, task_kp: 16}
    # pinky (little)
  - {origin: right_base_link, task: right_little_link_3, origin_kp: 0, task_kp: 18}
  - {origin: right_base_link, task: right_little_link_4, origin_kp: 0, task_kp: 19}
  - {origin: right_base_link, task: right_little_tip, origin_kp: 0, task_kp: 20}

  mediapipe_rotation:
    x: -5.0
    y: -5.0
    z: -15.0

render:
  camera:
    azimuth: 180
    elevation: -20
    distance: 0.5
