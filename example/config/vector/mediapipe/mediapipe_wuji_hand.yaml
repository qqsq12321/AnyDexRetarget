# Wuji Hand - KeyVectorOptimizer (MediaPipe video/camera input)
# Scale values from wuji-retargeting-private/config/vector/vector_video.yaml
# norm_delta=0.06: higher than AVP because monocular depth is noisier

optimizer:
  type: "KeyVectorOptimizer"

robot:
  type: "wuji_hand"
  urdf_path: "assets/wuji_hand/right.urdf"

retarget:
  huber_delta: 2.0
  norm_delta: 0.06
  lp_alpha: 0.4

  scaling_factor: 1.025
  key_vectors:
  - {origin: right_palm_link, task: right_finger1_tip_link, origin_kp: 0, task_kp: 4}
  - {origin: right_palm_link, task: right_finger2_tip_link, origin_kp: 0, task_kp: 8}
  - {origin: right_palm_link, task: right_finger3_tip_link, origin_kp: 0, task_kp: 12}
  - {origin: right_palm_link, task: right_finger4_tip_link, origin_kp: 0, task_kp: 16}
  - {origin: right_palm_link, task: right_finger5_tip_link, origin_kp: 0, task_kp: 20}
  - {origin: right_palm_link, task: right_finger1_link3, origin_kp: 0, task_kp: 2}
  - {origin: right_palm_link, task: right_finger2_link3, origin_kp: 0, task_kp: 6}
  - {origin: right_palm_link, task: right_finger3_link3, origin_kp: 0, task_kp: 10}
  - {origin: right_palm_link, task: right_finger4_link3, origin_kp: 0, task_kp: 14}
  - {origin: right_palm_link, task: right_finger5_link3, origin_kp: 0, task_kp: 18}

  mediapipe_rotation:
    x: -5.0
    y: -5.0
    z: -15.0

render:
  camera:
    azimuth: 180
    elevation: -20
    distance: 0.5
