# SVH Hand - KeyVectorOptimizer (MediaPipe video/camera input)
# norm_delta=0.06: higher than AVP because monocular depth is noisier

optimizer:
  type: "KeyVectorOptimizer"

robot:
  type: "svh_hand"
  urdf_path: "assets/schunk_hand/schunk_svh_hand_right.urdf"

retarget:
  huber_delta: 2.0
  norm_delta: 0.06
  lp_alpha: 0.4

  scaling_factor: 1.134
  key_vectors:
  - {origin: right_hand_base_link, task: thtip, origin_kp: 0, task_kp: 4}
  - {origin: right_hand_base_link, task: fftip, origin_kp: 0, task_kp: 8}
  - {origin: right_hand_base_link, task: mftip, origin_kp: 0, task_kp: 12}
  - {origin: right_hand_base_link, task: rftip, origin_kp: 0, task_kp: 16}
  - {origin: right_hand_base_link, task: lftip, origin_kp: 0, task_kp: 20}
  - {origin: right_hand_base_link, task: right_hand_a, origin_kp: 0, task_kp: 2}
  - {origin: right_hand_base_link, task: right_hand_p, origin_kp: 0, task_kp: 6}
  - {origin: right_hand_base_link, task: right_hand_o, origin_kp: 0, task_kp: 10}
  - {origin: right_hand_base_link, task: right_hand_n, origin_kp: 0, task_kp: 14}
  - {origin: right_hand_base_link, task: right_hand_m, origin_kp: 0, task_kp: 18}

  mediapipe_rotation:
    x: 0.0
    y: 0.0
    z: 0.0

render:
  camera:
    azimuth: 180
    elevation: -20
    distance: 0.5
