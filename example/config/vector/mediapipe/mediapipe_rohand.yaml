# ROHand - KeyVectorOptimizer (MediaPipe video/camera input)
# norm_delta=0.06: higher than AVP because monocular depth is noisier

optimizer:
  type: "KeyVectorOptimizer"

robot:
  type: "rohand"

retarget:
  huber_delta: 2.0
  norm_delta: 0.06
  lp_alpha: 0.4

  scaling_factor: 0.895
  key_vectors:
  - {origin: base_link, task: th_distal_link, origin_kp: 0, task_kp: 4}
  - {origin: base_link, task: if_distal_link, origin_kp: 0, task_kp: 8}
  - {origin: base_link, task: mf_distal_link, origin_kp: 0, task_kp: 12}
  - {origin: base_link, task: rf_distal_link, origin_kp: 0, task_kp: 16}
  - {origin: base_link, task: lf_distal_link, origin_kp: 0, task_kp: 20}

  mediapipe_rotation:
    x: 180.0
    y: 90.0
    z: -20.0

render:
  camera:
    azimuth: 180
    elevation: -20
    distance: 0.5
    lookat: [0, 0, 0.05]
