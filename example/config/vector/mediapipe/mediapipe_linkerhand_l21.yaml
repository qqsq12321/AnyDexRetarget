# LinkerHand L21 - KeyVectorOptimizer (MediaPipe video/camera input)
# norm_delta=0.06: higher than AVP because monocular depth is noisier

optimizer:
  type: "KeyVectorOptimizer"

robot:
  type: "linkerhand_l21"

retarget:
  huber_delta: 2.0
  norm_delta: 0.06
  lp_alpha: 0.4

  scaling_factor: 1.39
  key_vectors:
  - {origin: hand_base_link, task: thumb_tip, origin_kp: 0, task_kp: 4}
  - {origin: hand_base_link, task: index_tip, origin_kp: 0, task_kp: 8}
  - {origin: hand_base_link, task: middle_tip, origin_kp: 0, task_kp: 12}
  - {origin: hand_base_link, task: ring_tip, origin_kp: 0, task_kp: 16}
  - {origin: hand_base_link, task: pinky_tip, origin_kp: 0, task_kp: 20}
  - {origin: hand_base_link, task: thumb_metacarpals, origin_kp: 0, task_kp: 2}
  - {origin: hand_base_link, task: index_proximal, origin_kp: 0, task_kp: 6}
  - {origin: hand_base_link, task: middle_proximal, origin_kp: 0, task_kp: 10}
  - {origin: hand_base_link, task: ring_proximal, origin_kp: 0, task_kp: 14}
  - {origin: hand_base_link, task: pinky_proximal, origin_kp: 0, task_kp: 18}

  mediapipe_rotation:
    x: 0.0
    y: 0.0
    z: -20.0

render:
  camera:
    azimuth: 180
    elevation: -20
    distance: 0.5
