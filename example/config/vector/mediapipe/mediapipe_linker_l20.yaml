# Linker L20 - KeyVectorOptimizer (MediaPipe video/camera input)
# norm_delta=0.06: higher than AVP because monocular depth is noisier

optimizer:
  type: "KeyVectorOptimizer"

robot:
  type: "linker_l20"

retarget:
  huber_delta: 2.0
  norm_delta: 0.06
  lp_alpha: 0.4
  scaling_factor: 1.39

  # Pinch contact: pulls the thumb tip and the closest finger tip together
  # once they are within d2 (cm) of each other, so a pinch actually closes
  # instead of leaving a gap between the fingertip surfaces.
  w_contact: 0.0  # disabled
  # contact:
  #   thumb_tip_link: thumb_tip
  #   thumb_tip_kp: 4
  #   fingers:
  #     - {tip_link: index_tip, tip_kp: 8, d1: 2.0, d2: 4.0}
  #     - {tip_link: middle_tip, tip_kp: 12, d1: 2.0, d2: 4.0}
  #     - {tip_link: ring_tip, tip_kp: 16, d1: 2.0, d2: 4.0}
  #     - {tip_link: pinky_tip, tip_kp: 20, d1: 2.0, d2: 4.0}

  key_vectors:
  - {origin: hand_base_link, task: thumb_tip, origin_kp: 0, task_kp: 4}
  - {origin: hand_base_link, task: index_tip, origin_kp: 0, task_kp: 8}
  - {origin: hand_base_link, task: middle_tip, origin_kp: 0, task_kp: 12}
  - {origin: hand_base_link, task: ring_tip, origin_kp: 0, task_kp: 16}
  - {origin: hand_base_link, task: pinky_tip, origin_kp: 0, task_kp: 20}
  - {origin: hand_base_link, task: thumb_proximal, origin_kp: 0, task_kp: 2}
  - {origin: hand_base_link, task: index_middle, origin_kp: 0, task_kp: 6}
  - {origin: hand_base_link, task: middle_middle, origin_kp: 0, task_kp: 10}
  - {origin: hand_base_link, task: ring_middle, origin_kp: 0, task_kp: 14}
  - {origin: hand_base_link, task: pinky_middle, origin_kp: 0, task_kp: 18}

  mediapipe_rotation:
    x: -7.0
    y: 0.0
    z: -100.0

render:
  camera:
    azimuth: 90
    elevation: 0.0
    distance: 0.7
