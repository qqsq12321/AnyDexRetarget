# Linker L6 simulation baseline for avp; not device/user calibrated.
# Select left/right at runtime with --hand; see assets/linker_l6/README.md.

optimizer:
  type: "AdaptiveOptimizerAnalytical"

robot:
  type: "linker_l6"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 5.0
  w_dir: 1.0
  project_tip_dir: false
  w_full_hand: 1.0
  pinch_scaling: 1.3
  alpha: 0.7
  w_contact: 1.0
  segment_scaling:
    thumb: [1.3, 1.3, 1.3]
    index: [1.3, 1.3, 1.3]
    middle: [1.3, 1.3, 1.3]
    ring: [1.3, 1.3, 1.3]
    pinky: [1.3, 1.3, 1.3]

  pinch_thresholds:
    index: {d1: 2.0, d2: 4.0}
    middle: {d1: 2.0, d2: 4.0}
    ring: {d1: 2.0, d2: 4.0}
    pinky: {d1: 2.0, d2: 4.0}

  mediapipe_rotation:
    x: 0.0
    y: 0.0
    z: 0.0

  lp_alpha: 0.2

render:
  camera:
    azimuth: 180
    elevation: -10
    distance: 0.5
    lookat: [0, 0, 0.11]
