# Wuji Hand Configuration for Retargeting
# 5 fingers x 4 joints = 20 DOF

optimizer:
  type: "AdaptiveOptimizerAnalytical"

robot:
  type: "wuji_hand"
  urdf_path: "assets/wuji_hand/right.urdf"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 5.0
  w_dir: 1.0
  project_tip_dir: false
  w_full_hand: 1.0

  pinch_scaling: 1.0
  alpha: 1.0
  segment_scaling:
    thumb: [0.706, 1.31, 0.863, 0.869]
    index: [1.068, 1.197, 0.986, 1.079]
    middle: [1.005, 1.184, 0.982, 1.065]
    ring: [0.976, 1.285, 1.152, 1.194]
    pinky: [0.942, 1.669, 1.782, 1.767]

  pinch_thresholds:
    index: {d1: 2.0, d2: 4.0}
    middle: {d1: 2.0, d2: 4.0}
    ring: {d1: 2.0, d2: 4.0}
    pinky: {d1: 2.0, d2: 4.0}

  mediapipe_rotation:
    x: 0.0
    y: -5.0
    z: -20.0

  lp_alpha: 0.4

render:
  camera:
    azimuth: 180
    elevation: -20
    distance: 0.5
