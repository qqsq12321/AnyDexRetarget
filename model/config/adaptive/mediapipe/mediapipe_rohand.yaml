# ROHand Configuration for Retargeting
#
# Note: this enables retargeting with the external URDF assets.
# The repository does not currently include a MuJoCo XML model for ROHand.

optimizer:
  type: "AdaptiveOptimizerAnalytical"

robot:
  type: "rohand"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 5.0
  w_dir: 1.0
  project_tip_dir: false
  w_full_hand: 1.0

  pinch_scaling: 1.0
  alpha: 1.0
  segment_scaling:
    thumb: [0.707, 0.503, 0.503, 1.672]
    index: [1.18, 0.189, 0.189, 1.414]
    middle: [1.181, 0.192, 0.192, 1.635]
    ring: [1.182, 0.213, 0.213, 1.605]
    pinky: [1.201, 0.3, 0.3, 2.111]

  pinch_thresholds:
    index: {d1: 2.0, d2: 4.0}
    middle: {d1: 2.0, d2: 4.0}
    ring: {d1: 2.0, d2: 4.0}
    pinky: {d1: 2.0, d2: 4.0}

  mediapipe_rotation:
    x: 180.0
    y: 90.0
    z: -20.0

  lp_alpha: 0.4

render:
  camera:
    azimuth: 180
    elevation: -20
    distance: 0.5
    lookat: [0, 0, 0.05]
