# Gaia Hand20 Configuration for Retargeting
# Initial Gaia Hand20 simulation profile; scale values inherit the Wuji 20-DOF baseline.
# 5 fingers x 4 joints = 20 DOF

optimizer:
  type: "AdaptiveOptimizerAnalytical"

robot:
  type: "gaia_hand20"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 5.0
  w_dir: 1.0
  project_tip_dir: false
  w_full_hand: 1.0

  pinch_scaling: 1.0
  alpha: 1.0
  segment_scaling:
    thumb: [1.493, 1.128, 1.36, 1.411]
    index: [1.496, 1.581, 1.002, 1.102]
    middle: [1.501, 1.564, 0.999, 1.116]
    ring: [1.48, 1.697, 1.172, 1.251]
    pinky: [1.479, 2.204, 1.812, 1.851]

  pinch_thresholds:
    index: {d1: 2.0, d2: 4.0}
    middle: {d1: 2.0, d2: 4.0}
    ring: {d1: 2.0, d2: 4.0}
    pinky: {d1: 2.0, d2: 4.0}

  mediapipe_rotation:
    x: -5.0
    y: -5.0
    z: -20.0

  lp_alpha: 0.4

render:
  camera:
    azimuth: 180
    elevation: -20
    distance: 0.5
