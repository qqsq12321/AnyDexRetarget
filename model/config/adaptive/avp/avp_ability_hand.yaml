# Ability Hand Configuration for Retargeting
# 5 fingers, 2 links each, 10 DOF

optimizer:
  type: "AdaptiveOptimizerAnalytical"

robot:
  type: "ability_hand"
  urdf_path: "assets/ability_hand/ability_hand_right.urdf"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 5.0
  w_dir: 1.0
  project_tip_dir: false
  w_full_hand: 1.0

  pinch_scaling: 1.0
  alpha: 1.0
  segment_scaling:
    thumb: [0.51, 0.643, 0.98]
    index: [0.765, 0.899, 0.993]
    middle: [0.764, 0.879, 0.972]
    ring: [0.794, 0.918, 1.013]
    pinky: [0.861, 1.034, 1.139]

  pinch_thresholds:
    index: {d1: 2.0, d2: 8.0}
    middle: {d1: 2.0, d2: 4.0}
    ring: {d1: 2.0, d2: 4.0}
    pinky: {d1: 2.0, d2: 4.0}

  mediapipe_rotation:
    x: 0.0
    y: -5.0
    z: 0.0

  lp_alpha: 0.4

render:
  camera:
    azimuth: 180
    elevation: -20
    distance: 0.5
