# Linker L20 Configuration for Retargeting

optimizer:
  type: "AdaptiveOptimizerAnalytical"

robot:
  type: "linker_l20"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 5.0
  w_dir: 1.0
  project_tip_dir: false
  w_full_hand: 1.0
  pinch_scaling: 1.5101
  alpha: 1.0
  mcp_lateral_scale: 0.60
  thumb_scale: 1.0
  thumb_inward_offset: -0.02

  segment_scaling:
