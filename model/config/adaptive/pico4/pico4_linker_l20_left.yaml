    index: [1.9, 1.617, 1.624, 1.579]
    middle: [1.88, 1.58, 1.548, 1.47]
    ring: [1.9, 1.613, 1.613, 1.55]
    pinky: [1.95, 1.806, 1.821, 1.74]

  pinch_thresholds:
    index: {d1: 2.0, d2: 4.0}
    middle: {d1: 2.0, d2: 4.0}
    ring: {d1: 2.0, d2: 4.0}
    pinky: {d1: 2.0, d2: 4.0}

  mediapipe_rotation:
    x: -10.0
    y: 0.0
    z: 100.0

  lp_alpha: 0.4

render:
