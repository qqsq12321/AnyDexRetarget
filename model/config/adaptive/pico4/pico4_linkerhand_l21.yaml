# LinkerHand L21 Configuration for Retargeting

optimizer:
  type: "AdaptiveOptimizerAnalytical"

robot:
  type: "linkerhand_l21"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 5.0
  w_dir: 1.0
  project_tip_dir: false
  w_full_hand: 1.0
  pinch_scaling: 1.4799
  alpha: 1.0
  lateral_scaling: 0.85

  segment_scaling:
    thumb: [2.246, 0.633, 3.07, 0.589]
    index: [1.587, 1.049, 2.091, 1.038]
    middle: [1.709, 0.883, 1.781, 0.878]
    ring: [1.7, 0.938, 2.129, 1.032]
    pinky: [1.518, 1.497, 2.618, 1.138]

  pinch_thresholds:
    index: {d1: 2.0, d2: 4.0}
    middle: {d1: 2.0, d2: 4.0}
    ring: {d1: 2.0, d2: 4.0}
    pinky: {d1: 2.0, d2: 4.0}

  mediapipe_rotation:
    x: -5.0
    y: 0.0
    z: -20.0

  lp_alpha: 0.4

render:
  camera:
    azimuth: 180
    elevation: -20
    distance: 0.5
