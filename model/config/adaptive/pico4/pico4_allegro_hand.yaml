# Allegro Hand Configuration for Retargeting
# 4 fingers (thumb, index, middle, ring) x 4 joints = 16 DOF

optimizer:
  type: "AdaptiveOptimizerAnalytical"

robot:
  type: "allegro_hand"
  urdf_path: "assets/allegro_hand/allegro_hand_right.urdf"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 5.0
  w_dir: 1.0
  project_tip_dir: false
  w_full_hand: 1.0

  pinch_scaling: 0.9561
  alpha: 1.0
  segment_scaling:
    thumb: [1.385, 1.704, 0.631, 3.663]
    index: [0.501, 0.427, 2.566, 3.638]
    middle: [0.008, 0.359, 2.185, 3.078]
    ring: [0.552, 0.382, 2.613, 3.616]

  pinch_thresholds:
    index: {d1: 2.0, d2: 4.0}
    middle: {d1: 2.0, d2: 6.0}
    ring: {d1: 2.0, d2: 4.0}

  mediapipe_rotation:
    x: 0.0
    y: 0.0
    z: 0.0

  lp_alpha: 0.4

render:
  camera:
    azimuth: 180
    elevation: -20
    distance: 0.5
