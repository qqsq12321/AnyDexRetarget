# ROHand Configuration for Retargeting
#
# Note: this enables retargeting with the external URDF assets.
# The repository does not currently include a MuJoCo XML model for ROHand.

optimizer:
  type: "AdaptiveOptimizerAnalytical"

robot:
  type: "rohand"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 5.0
  w_dir: 1.0
  project_tip_dir: false
  w_full_hand: 1.0

  pinch_scaling: 0.9285
  alpha: 1.0
  segment_scaling:
    thumb: [0.949, 0.649, 0.649, 1.89]
    index: [1.23, 0.221, 0.221, 1.695]
    middle: [1.282, 0.192, 0.192, 1.637]
    ring: [1.319, 0.21, 0.21, 1.685]
    pinky: [1.284, 0.309, 0.309, 1.652]

  pinch_thresholds:
    index: {d1: 2.0, d2: 4.0}
    middle: {d1: 2.0, d2: 4.0}
    ring: {d1: 2.0, d2: 4.0}
    pinky: {d1: 2.0, d2: 4.0}

  mediapipe_rotation:
    x: 150.0
    y: 90.0
    z: -20.0

  lp_alpha: 0.4

render:
  camera:
    azimuth: 180
    elevation: -20
    distance: 0.5
    lookat: [0, 0, 0.05]
