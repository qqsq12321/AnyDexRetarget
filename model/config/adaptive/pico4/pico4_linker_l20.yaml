# Linker L20 Configuration for Retargeting

optimizer:
  type: "AdaptiveOptimizerAnalytical"

robot:
  type: "linker_l20"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 5.0
  w_dir: 1.0
  project_tip_dir: false
  w_full_hand: 1.0
  pinch_scaling: 1.5101
  alpha: 1.0
  lateral_scaling: 0.7
  segment_scaling:
    thumb: [1.269, 2.361, 1.232, 1.033]
    index: [1.753, 1.178, 1.512, 1.092]
    middle: [1.847, 0.992, 1.288, 0.924]
    ring: [1.884, 1.053, 1.54, 1.086]
    pinky: [1.825, 1.681, 1.894, 1.197]

  pinch_thresholds:
    index: {d1: 2.0, d2: 4.0}
    middle: {d1: 2.0, d2: 4.0}
    ring: {d1: 2.0, d2: 4.0}
    pinky: {d1: 2.0, d2: 4.0}

  # apply_mediapipe_transformations() yields mirrored Y axes for the
  # two hands.  Mirror the fixed palm-frame correction as well so the input
  # palm normal/width axes remain aligned with the L20 base frame.
  mediapipe_rotation:
    right: {x: -10.0, y: 0.0, z: -10.0}
    left: {x: 10.0, y: 0.0, z: 10.0}

  lp_alpha: 0.4

render:
  camera:
    azimuth: 180
    elevation: 0.0
    distance: 0.7
