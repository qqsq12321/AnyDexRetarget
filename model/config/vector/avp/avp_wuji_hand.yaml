# Wuji Hand - KeyVectorOptimizer (VisionPro AVP input)
# Scale values from wuji-retargeting-private/config/vector/vector_avp.yaml

optimizer:
  type: "KeyVectorOptimizer"

robot:
  type: "wuji_hand"
  urdf_path: "assets/wuji_hand/right.urdf"

retarget:
  huber_delta: 2.0
  norm_delta: 0.04
  lp_alpha: 0.4

  key_vectors:
    # thumb (finger1)
    - {origin: right_palm_link, task: right_finger1_link3,    origin_kp: 0, task_kp:  2, scale: 1.051}
    - {origin: right_palm_link, task: right_finger1_link4,    origin_kp: 0, task_kp:  3, scale: 1.026}
    - {origin: right_palm_link, task: right_finger1_tip_link, origin_kp: 0, task_kp:  4, scale: 1.024}
    # index (finger2)
    - {origin: right_palm_link, task: right_finger2_link3,    origin_kp: 0, task_kp:  6, scale: 1.096}
    - {origin: right_palm_link, task: right_finger2_link4,    origin_kp: 0, task_kp:  7, scale: 1.13}
    - {origin: right_palm_link, task: right_finger2_tip_link, origin_kp: 0, task_kp:  8, scale: 1.155}
    # middle (finger3)
    - {origin: right_palm_link, task: right_finger3_link3,    origin_kp: 0, task_kp: 10, scale: 1.053}
    - {origin: right_palm_link, task: right_finger3_link4,    origin_kp: 0, task_kp: 11, scale: 1.065}
    - {origin: right_palm_link, task: right_finger3_tip_link, origin_kp: 0, task_kp: 12, scale: 1.091}
    # ring (finger4)
    - {origin: right_palm_link, task: right_finger4_link3,    origin_kp: 0, task_kp: 14, scale: 1.075}
    - {origin: right_palm_link, task: right_finger4_link4,    origin_kp: 0, task_kp: 15, scale: 1.094}
    - {origin: right_palm_link, task: right_finger4_tip_link, origin_kp: 0, task_kp: 16, scale: 1.12}
    # pinky (finger5)
    - {origin: right_palm_link, task: right_finger5_link3,    origin_kp: 0, task_kp: 18, scale: 1.145}
    - {origin: right_palm_link, task: right_finger5_link4,    origin_kp: 0, task_kp: 19, scale: 1.22}
    - {origin: right_palm_link, task: right_finger5_tip_link, origin_kp: 0, task_kp: 20, scale: 1.246}

  mediapipe_rotation:
    x: -5.0
    y: -5.0
    z: 0.0

render:
  camera:
    azimuth: 135
    elevation: -20
    distance: 0.5
