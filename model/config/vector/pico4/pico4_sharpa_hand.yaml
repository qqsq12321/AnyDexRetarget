# Sharpa Hand - KeyVectorOptimizer (Pico 4 input)
# Scale values from pico4_wuji_hand.yaml

optimizer:
  type: "KeyVectorOptimizer"

robot:
  type: "sharpa_hand"

retarget:
  huber_delta: 2.0
  norm_delta: 0.04
  lp_alpha: 0.4

  key_vectors:
    # thumb
  - {origin: right_hand_C_MC, task: right_thumb_PP, origin_kp: 0, task_kp: 2, scale: 
      1.518}
  - {origin: right_hand_C_MC, task: right_thumb_DP, origin_kp: 0, task_kp: 3, 
      scale: 1.479}
  - {origin: right_hand_C_MC, task: right_thumb_fingertip, origin_kp: 0, task_kp: 
      4, scale: 1.367}
    # index
  - {origin: right_hand_C_MC, task: right_index_MP, origin_kp: 0, task_kp: 6, 
      scale: 1.184}
  - {origin: right_hand_C_MC, task: right_index_DP, origin_kp: 0, task_kp: 7, 
      scale: 1.233}
  - {origin: right_hand_C_MC, task: right_index_fingertip, origin_kp: 0, task_kp: 
      8, scale: 1.236}
    # middle
  - {origin: right_hand_C_MC, task: right_middle_MP, origin_kp: 0, task_kp: 10, 
      scale: 1.153}
  - {origin: right_hand_C_MC, task: right_middle_DP, origin_kp: 0, task_kp: 11, 
      scale: 1.182}
  - {origin: right_hand_C_MC, task: right_middle_fingertip, origin_kp: 0, 
      task_kp: 12, scale: 1.167}
    # ring
  - {origin: right_hand_C_MC, task: right_ring_MP, origin_kp: 0, task_kp: 14, 
      scale: 1.153}
  - {origin: right_hand_C_MC, task: right_ring_DP, origin_kp: 0, task_kp: 15, 
      scale: 1.208}
  - {origin: right_hand_C_MC, task: right_ring_fingertip, origin_kp: 0, task_kp: 
      16, scale: 1.21}
    # pinky
  - {origin: right_hand_C_MC, task: right_pinky_MP, origin_kp: 0, task_kp: 18, 
      scale: 1.274}
  - {origin: right_hand_C_MC, task: right_pinky_DP, origin_kp: 0, task_kp: 19, 
      scale: 1.35}
  - {origin: right_hand_C_MC, task: right_pinky_fingertip, origin_kp: 0, task_kp: 
      20, scale: 1.347}

  mediapipe_rotation:
    x: -2.0
    y: -7.0
    z: -15.0

render:
  camera:
    azimuth: 135
    elevation: -20
    distance: 0.5
