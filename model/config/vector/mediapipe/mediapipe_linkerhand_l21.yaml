# LinkerHand L21 - KeyVectorOptimizer (MediaPipe video/camera input)
# norm_delta=0.06: higher than AVP because monocular depth is noisier

optimizer:
  type: "KeyVectorOptimizer"

robot:
  type: "linkerhand_l21"

retarget:
  huber_delta: 2.0
  norm_delta: 0.06
  lp_alpha: 0.4

  key_vectors:
    # thumb
  - {origin: hand_base_link, task: thumb_metacarpals, origin_kp: 0, task_kp: 2, scale: 
      1.042}
  - {origin: hand_base_link, task: thumb_distal, origin_kp: 0, task_kp: 3, scale: 
      1.16}
  - {origin: hand_base_link, task: thumb_tip, origin_kp: 0, task_kp: 4, scale: 
      1.011}
    # index
  - {origin: hand_base_link, task: index_proximal, origin_kp: 0, task_kp: 6, 
      scale: 1.374}
  - {origin: hand_base_link, task: index_middle, origin_kp: 0, task_kp: 7, scale: 
      1.408}
  - {origin: hand_base_link, task: index_tip, origin_kp: 0, task_kp: 8, scale: 
      1.338}
    # middle
  - {origin: hand_base_link, task: middle_proximal, origin_kp: 0, task_kp: 10, 
      scale: 1.402}
  - {origin: hand_base_link, task: middle_middle, origin_kp: 0, task_kp: 11, 
      scale: 1.425}
  - {origin: hand_base_link, task: middle_tip, origin_kp: 0, task_kp: 12, scale: 
      1.353}
    # ring
  - {origin: hand_base_link, task: ring_proximal, origin_kp: 0, task_kp: 14, 
      scale: 1.391}
  - {origin: hand_base_link, task: ring_middle, origin_kp: 0, task_kp: 15, scale: 
      1.449}
  - {origin: hand_base_link, task: ring_tip, origin_kp: 0, task_kp: 16, scale: 
      1.387}
    # pinky
  - {origin: hand_base_link, task: pinky_proximal, origin_kp: 0, task_kp: 18, 
      scale: 1.403}
  - {origin: hand_base_link, task: pinky_middle, origin_kp: 0, task_kp: 19, 
      scale: 1.554}
  - {origin: hand_base_link, task: pinky_tip, origin_kp: 0, task_kp: 20, scale: 
      1.548}

  mediapipe_rotation:
    x: 0.0
    y: 0.0
    z: -20.0

render:
  camera:
    azimuth: 180
    elevation: -20
    distance: 0.5
