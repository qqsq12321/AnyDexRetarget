# Shadow Hand - KeyVectorOptimizer (MediaPipe input)
# 15 key vectors: rh_palm -> {middle, distal, tip} for each finger
# scale: 0.81 compensates for Shadow Hand being ~81% of human hand size

optimizer:
  type: "KeyVectorOptimizer"

robot:
  type: "shadow_hand"

retarget:
  huber_delta: 2.0
  norm_delta: 0.04
  lp_alpha: 0.4

  clamp_joint_lower:
    "J3": 0.0

  # MediaPipe keypoint indices:
  #   0: wrist
  #   Thumb:  2=mcp, 3=ip,  4=tip
  #   Index:  6=pip, 7=dip,  8=tip
  #   Middle: 10=pip,11=dip, 12=tip
  #   Ring:   14=pip,15=dip, 16=tip
  #   Pinky:  18=pip,19=dip, 20=tip
  key_vectors:
    # thumb
  - {origin: rh_palm, task: rh_thmiddle, origin_kp: 0, task_kp: 2, scale: 0.931}
  - {origin: rh_palm, task: rh_thdistal, origin_kp: 0, task_kp: 3, scale: 0.931}
  - {origin: rh_palm, task: rh_thtip, origin_kp: 0, task_kp: 4, scale: 0.912}
    # index finger
  - {origin: rh_palm, task: rh_ffmiddle, origin_kp: 0, task_kp: 6, scale: 1.119}
  - {origin: rh_palm, task: rh_ffdistal, origin_kp: 0, task_kp: 7, scale: 1.078}
  - {origin: rh_palm, task: rh_fftip, origin_kp: 0, task_kp: 8, scale: 1.075}
    # middle finger
  - {origin: rh_palm, task: rh_mfmiddle, origin_kp: 0, task_kp: 10, scale: 1.117}
  - {origin: rh_palm, task: rh_mfdistal, origin_kp: 0, task_kp: 11, scale: 1.073}
  - {origin: rh_palm, task: rh_mftip, origin_kp: 0, task_kp: 12, scale: 1.071}
    # ring finger
  - {origin: rh_palm, task: rh_rfmiddle, origin_kp: 0, task_kp: 14, scale: 1.125}
  - {origin: rh_palm, task: rh_rfdistal, origin_kp: 0, task_kp: 15, scale: 1.102}
  - {origin: rh_palm, task: rh_rftip, origin_kp: 0, task_kp: 16, scale: 1.11}
    # little finger
  - {origin: rh_palm, task: rh_lfmiddle, origin_kp: 0, task_kp: 18, scale: 1.177}
  - {origin: rh_palm, task: rh_lfdistal, origin_kp: 0, task_kp: 19, scale: 1.215}
  - {origin: rh_palm, task: rh_lftip, origin_kp: 0, task_kp: 20, scale: 1.269}

  mediapipe_rotation:
    x: -10.0
    y: 0.0
    z: -90.0

render:
  camera:
    azimuth: 180
    elevation: 0.0
    distance: 1.0
