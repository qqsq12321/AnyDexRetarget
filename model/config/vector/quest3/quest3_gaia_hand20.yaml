# Gaia Hand20 - KeyVectorOptimizer (Quest 3 HTS input)
# Initial Gaia Hand20 simulation profile; scale values inherit the Wuji 20-DOF baseline.
# Scale values from wuji-retargeting-private/config/vector/vector_quest3.yaml

optimizer:
  type: "KeyVectorOptimizer"

robot:
  type: "gaia_hand20"

retarget:
  huber_delta: 2.0
  norm_delta: 0.04
  lp_alpha: 0.4

  key_vectors:
    # thumb (thumb)
    - {origin: right_base_link, task: right_thumb_link_3,    origin_kp: 0, task_kp:  2, scale: 1.0}
    - {origin: right_base_link, task: right_thumb_link_4,    origin_kp: 0, task_kp:  3, scale: 1.0}
    - {origin: right_base_link, task: right_thumb_tip, origin_kp: 0, task_kp:  4, scale: 1.0}
    # index (index)
    - {origin: right_base_link, task: right_index_link_3,    origin_kp: 0, task_kp:  6, scale: 1.02}
    - {origin: right_base_link, task: right_index_link_4,    origin_kp: 0, task_kp:  7, scale: 1.05}
    - {origin: right_base_link, task: right_index_tip, origin_kp: 0, task_kp:  8, scale: 1.05}
    # middle (middle)
    - {origin: right_base_link, task: right_middle_link_3,    origin_kp: 0, task_kp: 10, scale: 1.0}
    - {origin: right_base_link, task: right_middle_link_4,    origin_kp: 0, task_kp: 11, scale: 1.0}
    - {origin: right_base_link, task: right_middle_tip, origin_kp: 0, task_kp: 12, scale: 1.0}
    # ring (ring)
    - {origin: right_base_link, task: right_ring_link_3,    origin_kp: 0, task_kp: 14, scale: 1.0}
    - {origin: right_base_link, task: right_ring_link_4,    origin_kp: 0, task_kp: 15, scale: 1.0}
    - {origin: right_base_link, task: right_ring_tip, origin_kp: 0, task_kp: 16, scale: 1.0}
    # pinky (little)
    - {origin: right_base_link, task: right_little_link_3,    origin_kp: 0, task_kp: 18, scale: 1.05}
    - {origin: right_base_link, task: right_little_link_4,    origin_kp: 0, task_kp: 19, scale: 1.12}
    - {origin: right_base_link, task: right_little_tip, origin_kp: 0, task_kp: 20, scale: 1.15}

  mediapipe_rotation:
    x: -2.0
    y: -7.0
    z: -15.0

render:
  camera:
    azimuth: 135
    elevation: -20
    distance: 0.5
