# Wuji Hand - KeyVectorOptimizer (Noitom PNS-G input)
# Scale values from wuji-retargeting-private/config/vector/vector_quest3.yaml

optimizer:
  type: "KeyVectorOptimizer"

robot:
  type: "wuji_hand"
  urdf_path: "assets/wuji_hand/right.urdf"

retarget:
  huber_delta: 2.0
  norm_delta: 0.04
  lp_alpha: 0.4

  key_vectors:
    # thumb (finger1)
    - {origin: right_palm_link, task: right_finger1_link3,    origin_kp: 0, task_kp:  2, scale: 1.2}
    - {origin: right_palm_link, task: right_finger1_link4,    origin_kp: 0, task_kp:  3, scale: 1.2}
    - {origin: right_palm_link, task: right_finger1_tip_link, origin_kp: 0, task_kp:  4, scale: 1.2}
    # index (finger2)
    - {origin: right_palm_link, task: right_finger2_link3,    origin_kp: 0, task_kp:  6, scale: 1.1}
    - {origin: right_palm_link, task: right_finger2_link4,    origin_kp: 0, task_kp:  7, scale: 1.14}
    - {origin: right_palm_link, task: right_finger2_tip_link, origin_kp: 0, task_kp:  8, scale: 1.15}
    # middle (finger3)
    - {origin: right_palm_link, task: right_finger3_link3,    origin_kp: 0, task_kp: 10, scale: 1.08}
    - {origin: right_palm_link, task: right_finger3_link4,    origin_kp: 0, task_kp: 11, scale: 1.07}
    - {origin: right_palm_link, task: right_finger3_tip_link, origin_kp: 0, task_kp: 12, scale: 1.07}
    # ring (finger4)
    - {origin: right_palm_link, task: right_finger4_link3,    origin_kp: 0, task_kp: 14, scale: 1.15}
    - {origin: right_palm_link, task: right_finger4_link4,    origin_kp: 0, task_kp: 15, scale: 1.1}
    - {origin: right_palm_link, task: right_finger4_tip_link, origin_kp: 0, task_kp: 16, scale: 1.1}
    # pinky (finger5)
    - {origin: right_palm_link, task: right_finger5_link3,    origin_kp: 0, task_kp: 18, scale: 1.2}
    - {origin: right_palm_link, task: right_finger5_link4,    origin_kp: 0, task_kp: 19, scale: 1.23}
    - {origin: right_palm_link, task: right_finger5_tip_link, origin_kp: 0, task_kp: 20, scale: 1.28}

  mediapipe_rotation:
    x: -7.0
    y: -7.0
    z: 0.0

render:
  camera:
    azimuth: 135
    elevation: -20
    distance: 0.5
